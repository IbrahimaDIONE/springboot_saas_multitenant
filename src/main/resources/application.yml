spring:
  application.name: springboot-saas-multitenant
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saas}
    username: ${DB_USER:saas}
    password: ${DB_PASSWORD:saas}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway.enabled: true
management.endpoints.web.exposure.include: health,info
server.port: ${PORT:8080}
app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-1234567890}
      access-token-minutes: 15
      refresh-token-days: 7
